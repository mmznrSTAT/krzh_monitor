  { re = "\\bunterschriften(sammlung|sammeln|bogen|bögen)?\\b|\\bsammeln von unterschriften\\b", gewicht = 4 },
  { re = "\\bvolksinitiative\\w*|\\bgemeindeinitiative\\w*|\\binitiativrecht\\b|\\burnenabstimmung\\w*|\\burnengang\\w*|\\burnengänge\\b", gewicht = 3 },
