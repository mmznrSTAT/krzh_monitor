  { re = "\\bopen government data\\b|\\boffene (behörden)?daten\\b|\\bopen data\\b", gewicht = 4 },
  { re = "\\bOGD\\b", gewicht = 4, cs = true },
  { re = "\\bdatenplattform\\b|\\bdatenkatalog\\b|\\bdatenraum\\b|\\bdatenökosystem\\b|\\bdatenintegration\\b", gewicht = 3 },
  { re = "\\bdatennutzung\\b|\\bdatenaustausch\\b|\\bdatenlieferung\\w*|\\bdatenbezug\\b|\\bdatenzugang\\b|\\bdatenweitergabe\\b|\\bdatenbeschaffung\\b", gewicht = 3 },
  { re = "\\b\\w*datenbank\\w*", gewicht = 2 },
  { re = "\\bdatenqualität\\b|\\bdatenstandard\\w*|\\bmetadaten\\b|\\bstammdaten\\b|\\bregisterharmonisierung\\b|\\bonce[- ]only\\b", gewicht = 3 },
  { re = "\\binteroperabilität\\b|\\bschnittstelle\\w*|\\blinked (open )?data\\b", gewicht = 2 },
  { re = "\\bAPI\\b", gewicht = 2, cs = true },
  { re = "\\bregisterdaten\\b|\\beinwohnerregister\\b|\\bpersonenregister\\b|\\bgebäude- und wohnungsregister\\b", gewicht = 2 },
