  { re = "\\bdemokratie\\b|\\bpartizipation\\b|\\bmilizsystem\\b", gewicht = 1 },
  { re = "\\bmitwirkung\\b|\\bmitbestimmung\\b", gewicht = 0.5 },
  { re = "\\bgemeindeversammlung\\w*|\\bgemeindeparlament\\w*|\\bpolitische balance\\b", gewicht = 1 },
