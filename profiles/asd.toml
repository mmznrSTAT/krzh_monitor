# --- Ausschlüsse ----------------------------------------------------------------------
# Geschäfte, deren Titel auf eines dieser Muster passt, werden nicht bewertet
# (parlamentsinterne Wahlen und Behördenbestellungen sowie Sammelgeschäfte, die jedes Amt
# erwähnen: Budget, KEF, Geschäftsbericht).
[ausschluss]
titel = [
  "^festsetzung budget\\b",
  "^konsolidierter entwicklungs- und finanzplan\\b",
  "^geschäftsbericht des regierungsrates\\b",
  "^jahresrechnung\\b|^rechnung \\d{4}\\b",
  "^wahl (ersatz)?mitglied\\b",
  "^(erneuerungs|ersatz)wahl\\b",
  "\\bspitalrat\\b",
  "\\bgeheime[n]? wahl\\b",
  "\\bamtsdauer \\d{4}",
]
