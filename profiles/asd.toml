  { re = "\\breferend(um|en|ums)\\b|\\bvolksabstimmung\\w*", gewicht = 1 },
  { re = "\\be-voting\\b|\\belektronische stimmabgabe\\b|\\bbriefliche stimmabgabe\\b|\\bstimmregister\\b|\\bstimmrechtsausweis\\w*|\\bwahlkreis\\w*|\\bproporz\\w*|\\bmajorz\\w*|\\bsitzzuteilung\\b", gewicht = 4 },
