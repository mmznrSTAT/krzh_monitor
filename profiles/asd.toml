# Relevanzprofil Amt für Statistik und Daten (ASD), Kanton Zürich
#
# Grundlage: Aufgaben nach VASD (öffentliche Statistik, Data Governance, Datenmanagement,
# Open Government Data, politische Rechte und Partizipation, Erhebungen) sowie angrenzende
# Themen der Digitalisierung.
#
# Jeder Begriff ist ein regulärer Ausdruck mit Gewicht; Gross-/Kleinschreibung spielt keine
# Rolle, ausser bei `cs = true` (Abkürzungen). Treffer im Titel zählen dreifach, in der
# Zusammenfassung doppelt, im Volltext einfach; der Volltextanteil ist gedeckelt. «relevant»
# setzt einen Titel- oder Zusammenfassungstreffer mit Gewicht >= titel_min_gewicht voraus,
# Volltexttreffer allein führen höchstens zu «prüfen».

[meta]
name = "ASD"
beschreibung = "Amt für Statistik und Daten, Direktion der Justiz und des Innern"

[scoring]
gewicht_titel = 3.0
gewicht_zusammenfassung = 2.0
gewicht_volltext = 1.0
volltext_max = 4.0
schwelle_relevant = 6.0
schwelle_pruefen = 4.0
titel_min_gewicht = 2.0
bonus_direktion = { JI = 1.0 }

# --- Themen -----------------------------------------------------------------------

[[thema]]
name = "Statistik"
begriffe = [
  { re = "\\b\\w*statisti\\w*", gewicht = 3 },
  { re = "\\bamt für statistik und daten\\b|\\bstatistisches amt\\b|\\bstatistik zürich\\b|\\bbundesamt für statistik\\b", gewicht = 4 },
  { re = "\\bASD\\b|\\bBFS\\b", gewicht = 3, cs = true },
  { re = "\\b\\w*indikator\\w*", gewicht = 2 },
  { re = "\\b\\w*monitoring\\b", gewicht = 2 },
  { re = "\\bkennzahl\\w*", gewicht = 2 },
  { re = "\\bdatenlage\\b|\\bdatengrundlage\\w*|\\bdatenbasis\\b", gewicht = 3 },
  { re = "\\bdatenerhebung\\w*|\\bstatistische[rn]? erhebung\\w*|\\berhebung (von|der) daten\\b|\\b\\w*befragung\\w*|\\b\\w*umfrage\\w*|\\bzensus\\b|\\bvolkszählung\\b|\\bmikrozensus\\b|\\bstrukturerhebung\\b", gewicht = 2 },
  { re = "\\bbevölkerungs(entwicklung|prognose\\w*|szenari\\w*|statistik|wachstum)\\b", gewicht = 2 },
  { re = "\\bwohlergehen\\w*|\\bwohlfahrtsmessung\\b|\\bbruttoinlandprodukt\\b", gewicht = 2 },
  { re = "\\bBIP\\b", gewicht = 2, cs = true },
  { re = "\\bauswertung\\w*|\\bevaluation\\b|\\bevaluier\\w*", gewicht = 0.5 },
  { re = "\\bregelmässige[rn]? bericht\\w*|\\bbericht(erstattung)? zum stand\\b", gewicht = 1 },
]

