[project]
name = "krzh-monitor"
version = "0.1.0"
description = "Beobachtet die Geschäfte des Zürcher Kantonsrats und bereitet ein wöchentliches Briefing auf"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
krzh = "krzh_monitor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
